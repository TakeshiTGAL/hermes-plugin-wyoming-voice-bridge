name: wyoming-voice-bridge
version: 0.1.5
manifest_version: 2
description: >-
  Speech recognition and speech synthesis for Hermes voice mode, on a Wyoming
  server you run. Built on the Wyoming protocol. Wyoming is the voice assistant
  protocol Home Assistant uses to talk to voice services, and the Whisper or
  Piper server you use with Home Assistant can also give Hermes voice mode its
  speech recognition and spoken replies.
  wyoming_voice_status returns one pre_tool_call approve line when the installed
  wyoming tree is the listed 1.5.4 wheel. Hermes shows that line.
  Session and always cover only the same which and the same host:port list
  when a person is present. cron, hermes -q, webhook, msgraph_webhook, and
  api_server do not send a describe, even after always.
  A different which or a different server asks again.
  This build lists one wyoming file-tree sha256, the official 1.5.4 wheel.
  A different tree is not imported and nothing is sent.
  A symlink at the ffmpeg path is refused before that path is resolved.
  This build lists no ffmpeg digest, so audio that is not already
  16 kHz, 16-bit, mono WAV is not converted.
author: TakeshiTGAL
license: MIT
homepage: https://github.com/TakeshiTGAL/hermes-plugin-wyoming-voice-bridge
tags: [wyoming, voice, stt, tts]
requires_hermes: ">=0.21.4"

python_dependencies:
  - "wyoming==1.5.4"

provides_tools:
  - wyoming_voice_status
provides_hooks:
  - pre_tool_call

optional_env:
  - name: WYOMING_STT_HOST
    description: "Hostname or IP of your Wyoming speech-recognition server. No URL."
    prompt: "Wyoming STT host"
    password: false
  - name: WYOMING_STT_PORT
    description: "TCP port of that server, from 1 to 65535."
    prompt: "Wyoming STT port"
    password: false
  - name: WYOMING_TTS_HOST
    description: "Hostname or IP of your Wyoming speech-synthesis server. No URL."
    prompt: "Wyoming TTS host"
    password: false
  - name: WYOMING_TTS_PORT
    description: "TCP port of that server, from 1 to 65535."
    prompt: "Wyoming TTS port"
    password: false
  - name: WYOMING_STT_MODEL
    description: "Model name the server lists as installed. Empty uses the server default."
    prompt: "Wyoming STT model"
    password: false
  - name: WYOMING_TTS_VOICE
    description: "Voice or speaker the server lists as installed. Empty uses the server default."
    prompt: "Wyoming TTS voice"
    password: false
config_schema:
  stt_language:
    type: str
    default: ""
    label: Speech recognition language
    description: >-
      Sent to the Wyoming speech-recognition server. Empty, or the word
      default, sends no language. This is the only language setting.
      The recognition language Hermes passes, stt.language, and the
      process environment are not read.
